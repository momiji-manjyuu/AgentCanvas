appId: dev.agentcanvas.app
productName: AgentCanvas
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../../packages/mcp-server/dist/bundle.cjs
    to: mcp-server/bundle.cjs
asar: true
mac:
  category: public.app-category.developer-tools
win:
  signAndEditExecutable: false
  target: nsis
linux:
  target:
    - AppImage
    - deb
